<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Convert a JavaScript object into JSON string, and send it to the server.</h1>
    <p id="result"></p>
    <script>
        var myObj = {
            name: "Riya",
            age: "12",
            grade: "7",
        }
        var myJSON = JSON.stringify(myObj);
        // converts object to JSON for sending data
        var newObj  = JSON.parse(myJSON);
        // converts JSONinto object while receiving data
        document.getElementById("result").innerHTML = newObj.name;
    </script>
</body>
</html>
